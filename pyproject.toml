[project]
name = "truman"
version = "0.1.0"
description = "Truman — a Goal-Driven Recursive AI System (Goal → Research → Generate → Simulate → Judge → re-iterate)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "worldseed[dm] @ file:///home/user/WorldSeed",
    "pydantic>=2.10,<3",
    "PyYAML>=6.0.2,<7",
    "litellm>=1.60,<2",
    "instructor>=1.7,<2",
    "structlog>=25.1,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
truman = "truman.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/truman"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
